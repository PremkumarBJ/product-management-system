<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>View Single Product</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f8fafc; color: #334155; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .form-card { background: white; padding: 36px; border-radius: 12px; border: 1px solid #e2e8f0; width: 100%; max-width: 420px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
    .form-card h2 { font-size: 22px; color: #0f172a; margin-bottom: 20px; text-align: center; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 6px; }
    input { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
    button { width: 100%; background-color: #2563eb; color: white; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:hover { background-color: #1d4ed8; }
    .result-box { margin-top: 24px; padding-top: 20px; border-top: 1px solid #e2e8f0; }
    .product-details { display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
    .product-details img { width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; margin-top: 10px; border: 1px solid #e2e8f0; }
    .back-link { display: block; text-align: center; margin-top: 18px; color: #64748b; text-decoration: none; font-size: 14px; font-weight: 500; }
  </style>
</head>
<body>

  <div class="form-card">
    <h2>Search Product</h2>
    <form id="searchForm">
      <div class="form-group">
        <label>Enter Product ID</label>
        <input type="number" id="id" placeholder="e.g. 1" required>
      </div>
      <button type="submit">Search</button>
    </form>

    <div id="result"></div>
    <a href="product_management.html" class="back-link">← Back to Menu</a>
  </div>

  <script>
    document.getElementById("searchForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const id = document.getElementById("id").value;
      const resultDiv = document.getElementById("result");

      try {
        const res = await fetch("/viewProduct/" + id);
        if (!res.ok) throw new Error("Product not found");

        const p = await res.json();
        resultDiv.className = "result-box";
        resultDiv.innerHTML = `
          <div class="product-details">
            <p><strong>ID:</strong> ${p.id ?? ""}</p>
            <p><strong>Name:</strong> ${p.name ?? ""}</p>
            <p><strong>Description:</strong> ${p.description ?? ""}</p>
            <p><strong>Price:</strong> $${p.price ?? ""}</p>
            <img src="${p.photoUrl ?? ''}" alt="${p.name ?? 'Product'}" onerror="this.src='https://via.placeholder.com/200?text=No+Image';">
          </div>
        `;
      } catch (error) {
        resultDiv.className = "result-box";
        resultDiv.innerHTML = "<p style='color:#dc2626; text-align:center;'>Product not found!</p>";
      }
    });
  </script>

</body>
</html>
